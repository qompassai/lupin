[package]
name = "lupin-mcp"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Revenue-alignment MCP server: opportunity ledger, capability matching, Qompass/NTRanch lanes."
repository = "https://github.com/qompassai/lupin"

# The crates.io package carries the fleet -mcp suffix (the bare name
# `lupin` is held by an unrelated crate); the binary keeps its name,
# matching the slipway-mcp / periscope-mcp convention.
[[bin]]
name = "lupin"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WS2 (D-113): framing moves to the official Rust MCP SDK, modern era
# only (2026-07-28). The version pin is the fleet pin — one rmcp
# version across every estate server; bumps are single fleet events.
rmcp = { version = "=3.8.0", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }

[profile.release]
lto = true
